apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-cm
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-svc:9090
        isDefault: true
        editable: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-svc:3100
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider-cm
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        folder: ""
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-cm
data:
  teemii.json: |
    {
      "uid": "teemii",
      "title": "Teemii",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pods listos",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(kube_pod_status_ready{pod=~\"teemii-.*\", condition=\"true\"})" }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Reinicios de contenedores",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(kube_pod_container_status_restarts_total{pod=~\"teemii-.*\"}) by (pod)", "legendFormat": "{{pod}}" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "CPU por pod (cores)",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(rate(container_cpu_usage_seconds_total{pod=~\"teemii-.*\", container!=\"\"}[5m])) by (pod)", "legendFormat": "{{pod}}" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Memoria por pod",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(container_memory_working_set_bytes{pod=~\"teemii-.*\", container!=\"\"}) by (pod)", "legendFormat": "{{pod}}" }
          ]
        },
        {
          "id": 5,
          "type": "logs",
          "title": "Logs frontend",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 10 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            { "refId": "A", "expr": "{app=\"teemii-frontend\"}" }
          ]
        },
        {
          "id": 6,
          "type": "logs",
          "title": "Logs backend",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 10 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            { "refId": "A", "expr": "{app=\"teemii-backend\"}" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources-cm
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider-cm
        - name: dashboards
          configMap:
            name: grafana-dashboards-cm
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-svc
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
