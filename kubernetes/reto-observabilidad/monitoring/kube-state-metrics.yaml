apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics-cr
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "namespaces", "persistentvolumeclaims"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets"]
    verbs: ["list", "watch"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics-sa
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          # Solo los recursos permitidos en el ClusterRole de arriba
          args:
            - --resources=nodes,pods,services,namespaces,persistentvolumeclaims,deployments,replicasets,daemonsets
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics-svc
  annotations:
    prometheus.io/scrape: "true"
spec:
  selector:
    app: kube-state-metrics
  ports:
    - port: 8080
      targetPort: 8080
