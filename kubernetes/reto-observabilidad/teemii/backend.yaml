apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teemii-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teemii-backend-deploy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: teemii-backend
  template:
    metadata:
      labels:
        app: teemii-backend
    spec:
      containers:
        - name: teemii-backend
          image: dokkaner/teemii-backend
          ports:
            - containerPort: 3000
            - containerPort: 1555
          volumeMounts:
            - name: teemii-data
              mountPath: /data
      volumes:
        - name: teemii-data
          persistentVolumeClaim:
            claimName: teemii-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: teemii-backend
spec:
  type: ClusterIP
  selector:
    app: teemii-backend
  ports:
    - name: api
      port: 3000
      targetPort: 3000
    - name: socketio
      port: 1555
      targetPort: 1555
